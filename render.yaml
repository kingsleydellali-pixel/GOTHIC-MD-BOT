services:
  - type: web
    name: gothic-md-bot-v6
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_ID
        sync: false          # set manually in Render dashboard
      - key: OWNER_NUMBER
        sync: true
      - key: CHANNEL_JID
        value: "120363421962437402@newsletter"
      - key: PORT
        value: "8000"
    autoDeploy: true
    healthCheckPath: /ping